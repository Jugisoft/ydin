<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raportit &amp; Ennakot — Superpesis Pro</title>
<script src="reports.js"></script>
<script src="pdata.js"></script>
<style>
  :root {
    --bg-primary: #0d1422;
    --bg-card: #131d2e;
    --bg-elevated: #1a2540;
    --bg-hover: #1f2e4a;
    --border: #1e2d45;
    --text-primary: #ffffff;
    --text-secondary: #8fa3c0;
    --text-muted: #4e6080;
    --accent-lime: #ccff00;
    --accent-cyan: #06b6d4;
    --accent-green: #22c55e;
    --accent-red: #ef4444;
    --accent-orange: #f97316;
    --accent-yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px; line-height: 1.5; min-height: 100vh;
  }
  #header {
    background: linear-gradient(180deg, #0a1020 0%, #0d1422 100%);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .logo-mark { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, #ccff00, #7dd956);
    color: #0a1020; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
  }
  .logo-text { font-weight: 700; font-size: 15px; }
  .logo-sub { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
  .header-divider { width: 1px; height: 28px; background: var(--border); }
  #main-nav { display: flex; gap: 2px; flex-wrap: wrap; }
  .nav-btn {
    padding: 6px 14px; background: transparent;
    border: 1px solid transparent; border-radius: 6px;
    color: var(--text-secondary); cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all 0.15s;
    white-space: nowrap; text-decoration: none;
    display: inline-flex; align-items: center;
  }
  .nav-btn:hover { color: var(--text-primary); background: var(--bg-hover); border-color: var(--border); }
  .nav-btn.active { color: #ccff00; border-bottom: 2px solid #ccff00; background: rgba(204,255,0,0.06); }
  .header-meta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-left: auto; }
  .season-badge {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 10px;
    font-size: 11px; font-weight: 600; color: var(--accent-cyan); letter-spacing: 0.5px;
  }
  .main { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  .page-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .page-sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }

  /* SUODATTIMET */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
  .filters select {
    background: var(--bg-elevated); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  .luonnos-info {
    font-size: 11px; color: var(--accent-orange);
    border: 1px dashed rgba(249,115,22,0.4); border-radius: 6px; padding: 5px 10px;
  }

  /* KORTIT */
  .card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 16px; overflow: hidden;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #2e4368; }
  .card-head { padding: 16px 20px; cursor: pointer; }
  .badge-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 20px;
  }
  .badge.ennakko { background: rgba(6,182,212,0.12); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,0.3); }
  .badge.raportti { background: rgba(34,197,94,0.12); color: var(--accent-green); border: 1px solid rgba(34,197,94,0.3); }
  .badge.luonnos { background: rgba(249,115,22,0.12); color: var(--accent-orange); border: 1px solid rgba(249,115,22,0.35); }
  .badge.tarkastettu { background: rgba(234,179,8,0.12); color: var(--accent-yellow); border: 1px solid rgba(234,179,8,0.35); }
  .badge.toimitettu { background: rgba(34,197,94,0.12); color: var(--accent-green); border: 1px solid rgba(34,197,94,0.35); }
  .badge.saa { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border); text-transform: none; letter-spacing: 0; font-weight: 500; }
  .card-title { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .card-meta { font-size: 12px; color: var(--text-secondary); }
  .card-meta b { color: var(--text-primary); }
  .card-teaser { margin-top: 8px; color: var(--text-secondary); font-size: 13px; }
  .lue-nappi { margin-top: 10px; font-size: 12px; color: var(--accent-lime); font-weight: 600; }

  /* ARTIKKELI */
  .card-body { display: none; padding: 4px 24px 24px; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }
  .card.open .lue-nappi .avaa { display: none; }
  .card:not(.open) .lue-nappi .sulje { display: none; }
  .artikkeli { max-width: 720px; margin: 0 auto; font-size: 15px; line-height: 1.75; }
  .artikkeli p { margin: 14px 0; color: #d7e1f0; }
  .artikkeli .nostoboksi, .artikkeli .spesiaali {
    border-radius: 10px; padding: 14px 18px; margin: 18px 0;
  }
  .artikkeli .nostoboksi { background: rgba(6,182,212,0.07); border: 1px solid rgba(6,182,212,0.3); }
  .artikkeli .spesiaali { background: rgba(249,115,22,0.06); border: 1px solid rgba(249,115,22,0.3); }
  .artikkeli .nosto-otsikko { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; margin-bottom: 6px; }
  .artikkeli .nostoboksi .nosto-otsikko { color: var(--accent-cyan); }
  .artikkeli .spesiaali .nosto-otsikko { color: var(--accent-orange); }
  .artikkeli .spesiaali ul { margin: 8px 0 8px 20px; }
  .artikkeli .spesiaali li { margin: 8px 0; color: #d7e1f0; }
  .artikkeli .pikku { font-size: 12px; color: var(--text-muted); }
  .artikkeli .vastuu {
    font-size: 12px; font-style: italic; color: var(--text-secondary);
    border-top: 1px solid var(--border); padding-top: 12px; margin-top: 22px;
  }
  .artikkeli .lahde { font-size: 11px; color: var(--text-muted); }
  .tyhja { text-align: center; color: var(--text-muted); padding: 60px 0; }

  /* ===== LIEKKI-INDEKSI -OSIO (3 & 5 pelin ikkuna) ===== */
  .liekki-osio {
    margin: 22px 0 4px; padding: 16px 18px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 10px;
  }
  .liekki-osio-otsikko {
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--accent-lime); margin-bottom: 4px;
  }
  .liekki-osio-alaotsikko { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .liekki-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .liekki-tiimi {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px;
  }
  .liekki-tiimi-nimi { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .liekki-rivi { margin-bottom: 12px; }
  .liekki-rivi:last-child { margin-bottom: 0; }
  .liekki-rivi-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 5px;
  }
  .liekki-ikkuna-nimi { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .liekki-arvo { font-size: 15px; font-weight: 800; }
  .liekki-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 12px; white-space: nowrap;
  }
  .lk-liekeissa { color: #f59e0b; background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.35); }
  .lk-hyvassa   { color: #4ade80; background: rgba(34,197,94,0.15);  border: 1px solid rgba(34,197,94,0.3); }
  .lk-tasainen  { color: #60a5fa; background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); }
  .lk-haparoiva { color: #94a3b8; background: rgba(148,163,184,0.1); border: 1px solid rgba(148,163,184,0.25); }
  .lk-kriisi    { color: #f87171; background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.3); }
  .lk-ei        { color: #94a3b8; background: rgba(100,116,139,0.1); border: 1px solid rgba(100,116,139,0.2); }
  .liekki-bar-wrap { position: relative; background: var(--bg-primary); border-radius: 5px; height: 10px; overflow: hidden; margin-bottom: 6px; }
  .liekki-bar { height: 10px; border-radius: 5px; }
  .lk-bar-liekeissa { background: linear-gradient(90deg,#ccff00,#88cc00); }
  .lk-bar-hyvassa   { background: linear-gradient(90deg,#22c55e,#16a34a); }
  .lk-bar-tasainen  { background: linear-gradient(90deg,#3b82f6,#06b6d4); }
  .lk-bar-haparoiva { background: #94a3b8; }
  .lk-bar-kriisi    { background: linear-gradient(90deg,#ef4444,#7f1d1d); }
  .liekki-erittely { font-size: 12px; color: var(--text-secondary); }
  .liekki-erittely b { color: var(--text-primary); }
  .liekki-osio-selite { font-size: 11px; color: var(--text-muted); margin-top: 12px; line-height: 1.5; }
  .liekki-puuttuu { font-size: 12px; color: var(--text-muted); }
  @media (max-width: 768px) {
    .card-head { padding: 14px 14px; }
    .card-body { padding: 4px 14px 18px; }
    .liekki-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header id="header">
  <div class="header-inner">
    <div class="logo-mark">
      <div class="logo-icon">SP</div>
      <div>
        <div class="logo-text">Superpesis Pro</div>
        <div class="logo-sub">Analytics Dashboard</div>
      </div>
    </div>
    <div class="header-divider"></div>
    <nav id="main-nav">
      <a href="index.html" class="nav-btn">🏠 Aloitus</a>
      <a href="lukkari.html" class="nav-btn">⚾ Lukkari</a>
      <a href="raportit.html" class="nav-btn active">📰 Raportit</a>
    </nav>
    <div class="header-meta">
      <span class="season-badge">MSU 2026</span>
    </div>
  </div>
</header>

<div class="main">
  <div class="page-title">📰 Raportit &amp; Ennakot</div>
  <div class="page-sub">Otteluennakot ja -raportit — data: pdata.js + api.pesistulokset.fi. Päivitetty: <span id="paivitetty">—</span></div>

  <div class="filters">
    <select id="f-tyyppi">
      <option value="">Kaikki tyypit</option>
      <option value="ennakko">Ennakot</option>
      <option value="raportti">Raportit</option>
    </select>
    <select id="f-joukkue">
      <option value="">Kaikki joukkueet</option>
    </select>
    <span class="luonnos-info" id="luonnos-info" style="display:none">Työjono: näytetään myös julkaisemattomat · <a href="https://github.com/Jugisoft/ydin/edit/main/reports.js" target="_blank" style="color:var(--accent-orange)">✏️ Muokkaa statuksia GitHubissa</a></span>
  </div>

  <div id="lista"></div>
</div>

<script>
(function(){
  var R = (typeof RAPORTIT !== 'undefined') ? RAPORTIT : { paivitetty:'', items:[] };
  var params = new URLSearchParams(location.search);
  var naytaLuonnokset = params.get('luonnokset') === '1' || location.hash === '#luonnokset';
  document.getElementById('paivitetty').textContent = R.paivitetty || '—';
  if (naytaLuonnokset) document.getElementById('luonnos-info').style.display = 'inline-block';

  // Joukkuesuodattimen vaihtoehdot datasta
  var joukkueet = {};
  R.items.forEach(function(it){ joukkueet[it.koti]=1; joukkueet[it.vieras]=1; });
  var fj = document.getElementById('f-joukkue');
  Object.keys(joukkueet).sort().forEach(function(j){
    var o = document.createElement('option'); o.value = j; o.textContent = j; fj.appendChild(o);
  });

  // ===== Liekki-indeksi (ikkunoitu: 3 & 5 peliä) =====
  // Sama kaava kuin dashboardissa, mutta rajattuna N viimeiseen peliin:
  //   Score = Voittoputki_N×20 + VoittoN%×50 + VoittoN%×30  (max 100)
  // pelit_5 on järjestetty vanhin→uusin; N viimeistä = slice(-N).
  var PD = (typeof PDATA !== 'undefined') ? PDATA : null;
  var LK_VARI = { liekeissa:'#f59e0b', hyvassa:'#4ade80', tasainen:'#60a5fa', haparoiva:'#94a3b8', kriisi:'#f87171', ei:'#94a3b8' };

  function lyhToTiimi(lyh){
    if (!PD || !PD.joukkueet) return null;
    var j = PD.joukkueet.filter(function(x){ return x.shorthand === lyh; })[0];
    return (j && j.pelit_5) ? j : null;
  }
  function liekkiLuokka(v){
    if (v === null || v === undefined || isNaN(v)) return {cls:'ei', bar:'', txt:'— EI PELANNUT'};
    if (v >= 80) return {cls:'liekeissa', bar:'lk-bar-liekeissa', txt:'🔥 LIEKEISSÄ'};
    if (v >= 70) return {cls:'hyvassa',   bar:'lk-bar-hyvassa',   txt:'✅ HYVÄSSÄ VIREESSÄ'};
    if (v >= 40) return {cls:'tasainen',  bar:'lk-bar-tasainen',  txt:'🟦 TASAINEN'};
    if (v >= 20) return {cls:'haparoiva', bar:'lk-bar-haparoiva', txt:'⚠️ HAPAROIVA'};
    return {cls:'kriisi', bar:'lk-bar-kriisi', txt:'❄️ KRIISI'};
  }
  function laskeIkkuna(pelit, N){
    var g = pelit.slice(-N);
    var n = g.length;
    if (!n) return null;
    var voitot = g.filter(function(x){ return x.res === 'W'; }).length;
    var putki = 0;
    for (var i = g.length - 1; i >= 0; i--){ if (g[i].res === 'W') putki++; else break; }
    var voittoPct = voitot / n;
    var score = Math.min(Math.round(putki*20 + voittoPct*50 + voittoPct*30), 100);
    var v3 = g.filter(function(x){ return x.res==='W' && x.pts===3; }).length; // suora voitto (3p)
    var v2 = g.filter(function(x){ return x.res==='W' && x.pts===2; }).length; // jatkovoitto (2p)
    var tj = g.filter(function(x){ return x.pts===1; }).length;               // jatkotappio (1p)
    var ts = g.filter(function(x){ return x.pts===0; }).length;               // suora tappio (0p)
    return {n:n, liekki:score, putki:putki, voitot:voitot, voittoPct:Math.round(voittoPct*100),
            v3:v3, v2:v2, tj:tj, ts:ts, tappiot:tj+ts,
            pisteet:(v3*3 + v2*2 + tj), maxpisteet:(n*3),
            jono: g.map(function(x){ return x.res; }).join('')};
  }
  function ikkunaRiviHtml(nimi, r){
    if (!r) return '<div class="liekki-rivi"><div class="liekki-ikkuna-nimi">' + nimi +
      '</div><div class="liekki-puuttuu">ei riittävästi pelejä</div></div>';
    var lk = liekkiLuokka(r.liekki);
    return '<div class="liekki-rivi">' +
      '<div class="liekki-rivi-head">' +
        '<span class="liekki-ikkuna-nimi">' + nimi +
          ' <span style="color:var(--text-muted);font-weight:500">(' + r.jono + ')</span></span>' +
        '<span style="display:flex;align-items:center;gap:8px">' +
          '<span class="liekki-arvo" style="color:' + LK_VARI[lk.cls] + '">' + r.liekki + '</span>' +
          '<span class="liekki-badge lk-' + lk.cls + '">' + lk.txt + '</span>' +
        '</span>' +
      '</div>' +
      '<div class="liekki-bar-wrap"><div class="liekki-bar ' + lk.bar + '" style="width:' + r.liekki + '%"></div></div>' +
      '<div class="liekki-erittely">' +
        '<b>' + r.v3 + '</b> × 3p-voitto · <b>' + r.v2 + '</b> × 2p-voitto · <b>' + r.tappiot + '</b> tappio' +
        (r.tj ? ' (' + r.tj + ' jatkolla)' : '') +
        ' · pisteet <b>' + r.pisteet + '</b>/' + r.maxpisteet +
      '</div>' +
    '</div>';
  }
  function tiimiHtml(lyh){
    var t = lyhToTiimi(lyh);
    if (!t) return '<div class="liekki-tiimi"><div class="liekki-tiimi-nimi">' + lyh +
      '</div><div class="liekki-puuttuu">Ei muotodataa (pdata.js)</div></div>';
    return '<div class="liekki-tiimi">' +
      '<div class="liekki-tiimi-nimi">' + lyh + ' <span style="color:var(--text-muted);font-weight:500;font-size:12px">' + t.name + '</span></div>' +
      ikkunaRiviHtml('3 viime peliä', laskeIkkuna(t.pelit_5, 3)) +
      ikkunaRiviHtml('5 viime peliä', laskeIkkuna(t.pelit_5, 5)) +
    '</div>';
  }
  function liekkiOsioHtml(it){
    if (!PD || !PD.joukkueet) return '';
    return '<div class="liekki-osio">' +
      '<div class="liekki-osio-otsikko">🔥 Liekki-indeksi — 3 &amp; 5 viime peliä</div>' +
      '<div class="liekki-osio-alaotsikko">Vire rajattuna viimeisiin otteluihin · data: pdata.js ' + (PD.paivitetty || '') + '</div>' +
      '<div class="liekki-grid">' + tiimiHtml(it.koti) + tiimiHtml(it.vieras) + '</div>' +
      '<div class="liekki-osio-selite">Kaava: Voittoputki×20 + Voitto%×50 + Voitto%×30 (max 100), laskettuna vain valitun ikkunan peleistä. ' +
      'Luokat: ≥80 🔥 Liekeissä · ≥70 ✅ Hyvässä vireessä · ≥40 🟦 Tasainen · ≥20 ⚠️ Haparoiva · &lt;20 ❄️ Kriisi. ' +
      'Tulosjono uusin oikealla: W = voitto, J = jatkotappio, L = suora tappio.</div>' +
    '</div>';
  }

  function saaBadge(s){
    if (!s) return '';
    var t = [];
    if (s.lampotila !== undefined) t.push(Math.round(s.lampotila) + '°C');
    if (s.kuvaus) t.push(s.kuvaus);
    return '<span class="badge saa">🌤️ ' + t.join(', ') + '</span>';
  }

  function fiPvm(iso){
    if (!iso) return '';
    var p = iso.split('-');
    return p.length === 3 ? (parseInt(p[2],10) + '.' + parseInt(p[1],10) + '.' + p[0]) : iso;
  }

  function render(){
    var ft = document.getElementById('f-tyyppi').value;
    var fjv = fj.value;
    var lista = document.getElementById('lista');
    lista.innerHTML = '';
    var nayt = R.items.filter(function(it){
      if (it.status !== 'julkaistu' && !naytaLuonnokset) return false;
      if (ft && it.tyyppi !== ft) return false;
      if (fjv && it.koti !== fjv && it.vieras !== fjv) return false;
      return true;
    });
    if (!nayt.length){
      var piilossa = R.items.filter(function(it){ return it.status !== 'julkaistu'; }).length;
      lista.innerHTML = '<div class="tyhja">Ei raportteja näillä suodattimilla.' +
        (piilossa && !naytaLuonnokset ? '<br><a href="' + (location.protocol === 'file:' ? '#luonnokset' : 'raportit.html?luonnokset=1') + '" onclick="setTimeout(function(){location.reload();},0)" style="color:#ccff00;font-size:13px">🗂️ Avaa työjono (' + piilossa + ' luonnosta/tarkastettavaa piilossa)</a>' : '') + '</div>';
      return;
    }
    nayt.forEach(function(it){
      var card = document.createElement('div');
      card.className = 'card'; card.id = it.id;
      var badges = '<span class="badge ' + it.tyyppi + '">' + it.tyyppi + '</span>';
      if (it.status !== 'julkaistu') badges += '<span class="badge ' + (['tarkastettu','toimitettu'].indexOf(it.status) >= 0 ? it.status : 'luonnos') + '">' + it.status + '</span>';
      badges += saaBadge(it.saa);
      card.innerHTML =
        '<div class="card-head">' +
          '<div class="badge-row">' + badges + '</div>' +
          '<div class="card-title">' + it.otsikko + '</div>' +
          '<div class="card-meta"><b>' + it.koti + ' – ' + it.vieras + '</b> · ' +
            fiPvm(it.pvm) + (it.klo ? ' klo ' + it.klo : '') +
            (it.stadion ? ' · ' + it.stadion : '') + '</div>' +
          (it.teaser ? '<div class="card-teaser">' + it.teaser + '</div>' : '') +
          '<div class="lue-nappi"><span class="avaa">Lue koko juttu ↓</span><span class="sulje">Sulje ↑</span></div>' +
        '</div>' +
        '<div class="card-body"><div class="artikkeli">' + (it.html || '') + '</div>' + liekkiOsioHtml(it) + '</div>';
      card.querySelector('.card-head').addEventListener('click', function(){
        card.classList.toggle('open');
        if (card.classList.contains('open')) history.replaceState(null, '', '#' + it.id);
      });
      lista.appendChild(card);
    });
    // hash-linkki avaa suoraan (#luonnokset on tilalippu, ei kortti-id)
    if (location.hash && location.hash !== '#luonnokset'){
      var h = document.getElementById(location.hash.slice(1));
      if (h){ h.classList.add('open'); h.scrollIntoView(); }
    }
  }

  document.getElementById('f-tyyppi').addEventListener('change', render);
  fj.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
