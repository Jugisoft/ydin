<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peräkkäiset onnistumiset — Superpesis Pro</title>
<style>
:root{
  --bg-primary:#0d1422; --bg-card:#131d2e; --bg-elevated:#1a2540;
  --bg-hover:#1f2e4a; --border:#1e2d45;
  --text-primary:#fff; --text-secondary:#8fa3c0; --text-muted:#4e6080;
  --accent-lime:#ccff00; --accent-cyan:#06b6d4; --accent-green:#22c55e;
  --accent-red:#ef4444; --accent-orange:#f97316; --accent-yellow:#eab308;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-primary);color:var(--text-primary);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.5;padding:0 0 60px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

#header{background:linear-gradient(180deg,#0a1020 0%,#0d1422 100%);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
  backdrop-filter:blur(8px)}
.header-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;
  align-items:center;gap:16px;flex-wrap:wrap}
.logo-mark{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-icon{width:34px;height:34px;border-radius:8px;
  background:linear-gradient(135deg,#ccff00,#7dd956);color:#0a1020;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:13px}
.logo-text{font-weight:700;font-size:15px}
.logo-sub{font-size:10px;color:var(--text-muted);letter-spacing:1px;
  text-transform:uppercase}
.header-divider{width:1px;height:28px;background:var(--border)}
#main-nav{display:flex;gap:2px;flex-wrap:wrap}
.nav-btn{padding:6px 14px;background:transparent;border:1px solid transparent;
  border-radius:6px;color:var(--text-secondary);cursor:pointer;font-size:13px;
  font-weight:500;transition:all .15s;white-space:nowrap;text-decoration:none;
  display:inline-flex;align-items:center}
.nav-btn:hover{color:var(--text-primary);background:var(--bg-hover);
  border-color:var(--border)}
.nav-btn.active{color:#ccff00;border-bottom:2px solid #ccff00;
  background:rgba(204,255,0,.06)}
.header-meta{display:flex;align-items:center;gap:12px;flex-shrink:0;
  margin-left:auto}
.season-badge{background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;
  color:var(--accent-cyan);letter-spacing:.5px}
.page-title{font-size:23px;font-weight:700;letter-spacing:-.4px;
  margin:22px 0 4px}
.sub{color:var(--text-secondary);font-size:13px;margin-bottom:22px}

/* --- ohjaimet --- */
.ctrl{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:18px}
.cg{display:flex;flex-direction:column;gap:6px}
.cg label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--text-muted);font-weight:700}
select,input[type=date]{background:var(--bg-elevated);color:var(--text-primary);
  border:1px solid var(--border);border-radius:7px;padding:7px 10px;
  font-size:13px;font-family:inherit;min-width:150px}
select:focus,input:focus{outline:none;border-color:var(--accent-cyan)}
.seg{display:flex;background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:7px;overflow:hidden}
.seg button{background:none;border:none;color:var(--text-secondary);
  padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;
  font-weight:600;transition:.15s}
.seg button:hover{background:var(--bg-hover);color:var(--text-primary)}
.seg button.on{background:var(--accent-cyan);color:#06202a}

/* --- tilannevalinta --- */
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);
  border:1px solid var(--border);border-radius:7px;padding:6px 11px;
  font-size:12.5px;cursor:pointer;user-select:none;transition:.15s;
  font-variant-numeric:tabular-nums}
.chip:hover{background:var(--bg-hover);border-color:var(--text-muted)}
.chip.on{background:rgba(6,182,212,.17);border-color:var(--accent-cyan);
  color:var(--text-primary)}
.chip:not(.on){color:var(--text-muted)}
.chip .bx{width:13px;height:13px;border-radius:3px;border:1.5px solid currentColor;
  display:inline-block;position:relative;flex:0 0 auto}
.chip.on .bx{background:var(--accent-cyan);border-color:var(--accent-cyan)}
.chip.on .bx::after{content:'';position:absolute;left:3.5px;top:.5px;width:4px;
  height:8px;border:solid #06202a;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chip small{color:var(--text-muted);font-size:11px}
.chip.on small{color:var(--text-secondary)}
.mini{display:flex;gap:8px;margin-top:7px}
.mini button{background:none;border:none;color:var(--accent-cyan);cursor:pointer;
  font-size:11.5px;font-family:inherit;padding:0;text-decoration:underline}
.mini button:hover{color:var(--text-primary)}
.warn{background:rgba(249,115,22,.11);border:1px solid rgba(249,115,22,.4);
  border-radius:8px;padding:10px 13px;font-size:12px;color:#fed7aa;
  margin-top:12px;line-height:1.5}

/* --- kortit --- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:18px;margin-bottom:20px}
.card{background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:18px 20px}
.card h2{font-size:14px;font-weight:700;margin-bottom:4px;letter-spacing:-.2px}
.card .hint{font-size:11.5px;color:var(--text-muted);margin-bottom:16px;
  line-height:1.45}

/* --- avainluvut --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;margin-bottom:20px}
.kpi{background:var(--bg-card);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent-cyan)}
.kpi.lime::before{background:var(--accent-lime)}
.kpi.green::before{background:var(--accent-green)}
.kpi.orange::before{background:var(--accent-orange)}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--text-muted);font-weight:700}
.kpi .val{font-size:29px;font-weight:800;letter-spacing:-1.2px;margin-top:5px;
  font-variant-numeric:tabular-nums}
.kpi .note{font-size:11.5px;color:var(--text-secondary);margin-top:3px}

/* --- palkit --- */
.bar{margin-bottom:11px}
.bar .top{display:flex;justify-content:space-between;font-size:12.5px;
  margin-bottom:4px}
.bar .top b{font-variant-numeric:tabular-nums;font-weight:700}
.track{height:9px;background:var(--bg-elevated);border-radius:5px;
  overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px;transition:width .35s ease}
.ghost{position:absolute;top:0;height:100%;border-radius:5px;
  background:rgba(143,163,192,.32)}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-secondary);
  margin-top:12px}
.legend i{display:inline-block;width:11px;height:9px;border-radius:3px;
  margin-right:5px;vertical-align:middle}

/* --- taulukko --- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--text-muted);font-weight:700;
  padding:0 8px 9px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid rgba(30,45,69,.55);text-align:right;
  font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.me{background:rgba(6,182,212,.11)}
tbody tr.me td{font-weight:700}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:12px;
  font-weight:700;min-width:52px;text-align:center}

.err{background:rgba(239,68,68,.12);border:1px solid var(--accent-red);
  border-radius:10px;padding:18px;color:#fecaca;line-height:1.6}
.err code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px;
  font-size:12.5px}
.foot{color:var(--text-muted);font-size:11.5px;margin-top:26px;line-height:1.7;
  border-top:1px solid var(--border);padding-top:16px}
.wide{grid-column:1/-1}
</style>

 if(a&&location.protocol==='file:')a.href='Superpesis_Pro_Dashboard.html';})();

<script src="pdata_ketjut.js"></script>
<script>
(function(){
"use strict";

var app = document.getElementById('app');
var sub = document.getElementById('sub');

if (typeof PKETJUT === 'undefined') {
  sub.textContent = 'Datatiedosto puuttuu';
  app.innerHTML = '<div class="err"><b>pdata_ketjut.js puuttuu.</b><br><br>' +
    'Aja ensin Windowsissa:<br><code>python vie_ketjut.py</code><br><br>' +
    'Se lukee <code>Vain arvot.xlsx</code>:n ja kirjoittaa datatiedoston ' +
    'tämän sivun viereen. Tuotantotiedostoihin ei kosketa.</div>';
  return;
}

// ------------------------------------------------------------------
// Vakiot
// ------------------------------------------------------------------
var TIL = PKETJUT.tilanteet;                 // ["0","1","2","3","1-2",...]
var TIL_NIMI = {
  "0":"0-tilanne (tyhjä)", "1":"1-tilanne", "2":"2-tilanne", "3":"3-tilanne",
  "1-2":"1-2-tilanne", "1-3":"1-3-tilanne", "2-3":"2-3-tilanne",
  "1-2-3":"1-2-3-tilanne (täysi)"
};
// Millä pesävälillä kärki etenee — näytetään sirussa muistin tueksi
var TIL_KARKI = PKETJUT.karki || {
  "0":"0-1","1":"1-2","2":"2-3","1-2":"2-3",
  "3":"3-K","1-3":"3-K","2-3":"3-K","1-2-3":"3-K"
};
// Tilanteet joissa ykköspesä on tyhjä -> lyöjä saa "onnistumisen"
// pelkästään menemällä itse ykköselle, vaikka kärki ei etene.
var HALPA_TIL = {"2":1,"3":1,"2-3":1};
var MAXP = 6;                                 // 6 = "6+"

var joukkueet = [];
(function(){
  var s = {};
  PKETJUT.vuoroparit.forEach(function(vp){ s[vp.jk] = 1; });
  joukkueet = Object.keys(s).sort();
})();

var pvmt = PKETJUT.vuoroparit.map(function(v){ return v.pvm; })
             .filter(Boolean).sort();
var PVM_MIN = pvmt[0] || '', PVM_MAX = pvmt[pvmt.length-1] || '';

// Ottelupäivät uusimmasta — "viimeiset N ottelua" -suodatinta varten
var uniqPvm = [];
(function(){
  var s = {};
  pvmt.forEach(function(p){ s[p]=1; });
  uniqPvm = Object.keys(s).sort().reverse();
})();

// ------------------------------------------------------------------
// Tila
// ------------------------------------------------------------------
var S = {
  jk: joukkueet.indexOf('KPL') >= 0 ? 'KPL' : joukkueet[0],
  tulkinta: 'salliva',          // salliva | tiukka | karki
  tilanteet: TIL.slice(),       // valitut alkutilanteet (oletus: kaikki)
  palot: 'kaikki',
  jakso: 'kaikki'
};

/* Onnistuiko lyöntivuoro valitulla tulkinnalla. */
function okBitti(){
  return S.tulkinta === 'karki' ? 4 : (S.tulkinta === 'tiukka' ? 2 : 1);
}

// ------------------------------------------------------------------
// Laskenta
// ------------------------------------------------------------------
function pvmRaja(){
  if (S.jakso === 'kaikki') return PVM_MIN;
  var n = parseInt(S.jakso, 10);
  return uniqPvm[Math.min(n, uniqPvm.length) - 1] || PVM_MIN;
}

/* Nopea deterministinen satunnaisgeneraattori (xorshift32).
   Deterministinen, jotta samat suodattimet antavat aina saman luvun.       */
var _seed = 2463534242;
function rndReset(){ _seed = 2463534242; }
function rnd(){
  _seed ^= _seed << 13; _seed ^= _seed >>> 17; _seed ^= _seed << 5;
  return (_seed >>> 0) / 4294967296;
}

/* Poimii yhden joukkueen lyöntivuoroparit aikaväliltä. */
function poimiVuoroparit(jk){
  var raja = pvmRaja(), ulos = [];
  var vps = PKETJUT.vuoroparit;
  for (var i=0;i<vps.length;i++){
    var vp = vps[i];
    if (jk && vp.jk !== jk) continue;
    if (vp.pvm && vp.pvm < raja) continue;
    ulos.push(vp);
  }
  return ulos;
}

/* Kerää ketjut annetusta vuoropariluettelosta.
   onnistui[] on litteä totuusarvotaulukko samassa järjestyksessä kuin
   vuorot kuljetaan läpi. Sama koodi ajaa sekä toteutuneen datan että
   permutoidun vertailun.                                                   */
function keraaKetjut(vps, onnistui){
  var ketjut = new Array(MAXP+1).fill(0);
  var ketjuJr = new Array(MAXP+1).fill(0);
  var suodPa = S.palot === 'kaikki' ? -1 : parseInt(S.palot,10);
  var salli = {};
  S.tilanteet.forEach(function(t){ salli[t] = 1; });
  var kaikkiTil = S.tilanteet.length === TIL.length;
  var pos = 0;

  for (var i=0;i<vps.length;i++){
    var arr = vps[i].v;
    var putki=0, aTil=-1, aPa=-1, pJr=0;
    for (var j=0;j<arr.length;j++){
      var v = arr[j];
      if (onnistui[pos++]){
        if (putki===0){ aTil=v[0]; aPa=v[1]; }
        putki++; pJr += v[3];
      } else {
        if (putki) tal(putki, aTil, aPa, pJr);
        putki=0; pJr=0;
      }
    }
    if (putki) tal(putki, aTil, aPa, pJr);
  }
  function tal(pit, aTil, aPa, jr){
    if (!kaikkiTil && !salli[TIL[aTil]]) return;
    if (suodPa >= 0 && aPa !== suodPa) return;
    var k = Math.min(pit, MAXP);
    ketjut[k]++; ketjuJr[k] += jr;
  }
  return { ketjut:ketjut, ketjuJr:ketjuJr };
}

/* Fisher-Yates paikan päällä. */
function sekoita(a){
  for (var i=a.length-1;i>0;i--){
    var j = (rnd()*(i+1))|0;
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
}

var SIM_KIERROKSIA = 60;

/* Palauttaa joukkueen tunnusluvut.

   ODOTUSARVO — permutaatiotesti, ei arvontaa:
   1) Ketju katkeaa myös lyöntivuoroparin loppuun, jolloin keskeneräinen
      ketju typistyy. Tasaiseen p:hen verrattuna jokainen joukkue näyttäisi
      huonolta ketjuttajalta pelkän rakenteen takia (mitattu: indeksi 84-91
      puhtaalla satunnaisdatalla).
   2) Jos odotusarvo arvottaisiin Bernoulli(p):stä, onnistumisten MÄÄRÄ
      vaihtelisi kierroksesta toiseen, kun havainnossa se on kiinteä.
      Pitkien ketjujen määrä on kupera funktio onnistumisten määrästä, joten
      Jensenin epäyhtälön nojalla odotusarvo yliarvioituisi systemaattisesti
      (mitattu: indeksi 93-100 riippumattomalla datalla).
   Ratkaisu molempiin: sekoitetaan joukkueen OMAT onnistumiset uuteen
   satunnaiseen järjestykseen samaan vuoropari- ja tilannerakenteeseen.
   Onnistumisten määrä ja rakenne säilyvät täsmälleen, vain järjestys
   satunnaistuu — jäljelle jää puhtaasti se, kasautuvatko ne vai eivät.     */
function analysoi(jk){
  var vps = poimiVuoroparit(jk);
  var n=0, onn=0, jrTot=0;
  var tilN = TIL.map(function(){ return 0; });
  var tilOnn = TIL.map(function(){ return 0; });
  var bitti = okBitti();
  var lippu = [];

  for (var i=0;i<vps.length;i++){
    var arr = vps[i].v;
    for (var j=0;j<arr.length;j++){
      var v = arr[j];
      var hyva = (v[2] & bitti) ? 1 : 0;
      lippu.push(hyva);
      n++; if (hyva) onn++;
      jrTot += v[3];
      if (v[0] >= 0){ tilN[v[0]]++; if (hyva) tilOnn[v[0]]++; }
    }
  }
  var p = n ? onn/n : 0;

  // Toteutunut
  var tot = keraaKetjut(vps, lippu);

  // Odotettu: samat onnistumiset, satunnainen järjestys
  var od = new Array(MAXP+1).fill(0);
  if (onn > 0 && onn < n){
    rndReset();
    var kopio = lippu.slice();
    for (var s=0;s<SIM_KIERROKSIA;s++){
      sekoita(kopio);
      var sim = keraaKetjut(vps, kopio);
      for (var k=1;k<=MAXP;k++) od[k] += sim.ketjut[k];
    }
    for (var k2=1;k2<=MAXP;k2++) od[k2] /= SIM_KIERROKSIA;
  }

  function summa(a, alkaen){
    var s2=0; for (var q=alkaen;q<=MAXP;q++) s2 += a[q]; return s2;
  }
  var yht    = summa(tot.ketjut, 1);
  var yht3   = summa(tot.ketjut, 3);
  var odYht  = summa(od, 1);
  var odYht3 = summa(od, 3);

  // Indeksi vain riittävällä otoksella
  var indeksi = (odYht3 >= 10) ? (yht3 / odYht3 * 100) : null;

  return {
    jk:jk, n:n, onn:onn, p:p, juoksut:jrTot,
    ketjut:tot.ketjut, ketjuJr:tot.ketjuJr, odotettu:od,
    ketjujaYht:yht, ketjuja3:yht3, odotettuYht:odYht, odotettu3:odYht3,
    indeksi:indeksi, tilN:tilN, tilOnn:tilOnn
  };
}

// ------------------------------------------------------------------
// Apurit
// ------------------------------------------------------------------
function pros(x,d){ return (x*100).toFixed(d===undefined?1:d).replace('.',',')+' %'; }
function luku(x){ return String(x).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function idxVari(v){
  if (v === null) return 'var(--text-muted)';
  if (v >= 103) return 'var(--accent-green)';
  if (v >= 98)  return 'var(--accent-lime)';
  if (v >= 94)  return 'var(--accent-orange)';
  return 'var(--accent-red)';
}
function esc(s){ return String(s).replace(/[&<>]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

// ------------------------------------------------------------------
// Renderöinti
// ------------------------------------------------------------------
function render(){
  var kaikki = joukkueet.map(analysoi);
  var me = kaikki.filter(function(x){ return x.jk === S.jk; })[0];
  var h = '';

  // ---- Ohjaimet ----
  h += '<div class="ctrl">';
  h += '<div class="cg"><label>Joukkue</label><select id="f-jk">' +
       joukkueet.map(function(j){
         return '<option value="'+esc(j)+'"'+(j===S.jk?' selected':'')+'>'+esc(j)+'</option>';
       }).join('') + '</select></div>';

  h += '<div class="cg" style="flex:1 1 560px"><label>Ketju alkaa tilanteesta ' +
       '<span style="color:var(--text-secondary);text-transform:none;' +
       'letter-spacing:0;font-weight:400">— suluissa pesäväli jolla kärki etenee' +
       '</span></label><div class="chips">' +
       TIL.map(function(t){
         var on = S.tilanteet.indexOf(t) >= 0;
         return '<span class="chip'+(on?' on':'')+'" data-til="'+t+'">' +
                '<span class="bx"></span>'+esc(TIL_NIMI[t]||t)+
                ' <small>('+esc(TIL_KARKI[t]||'')+')</small></span>';
       }).join('') +
       '</div><div class="mini">' +
       '<button data-sel="kaikki">Kaikki</button>' +
       '<button data-sel="tayttyva">Vain ne joissa ykkönen tyhjä</button>' +
       '<button data-sel="muut">Vain muut</button>' +
       '</div></div>';

  h += '<div class="cg"><label>Paloja alla</label><select id="f-pa">' +
       ['kaikki','0','1','2'].map(function(v){
         return '<option value="'+v+'"'+(v===S.palot?' selected':'')+'>'+
                (v==='kaikki'?'Kaikki':v+' paloa')+'</option>';
       }).join('') + '</select></div>';

  h += '<div class="cg"><label>Ajanjakso</label><select id="f-jakso">' +
       [['kaikki','Koko kausi'],['5','Viimeiset 5 pelipäivää'],
        ['10','Viimeiset 10 pelipäivää'],['20','Viimeiset 20 pelipäivää']]
       .map(function(o){
         return '<option value="'+o[0]+'"'+(o[0]===S.jakso?' selected':'')+'>'+o[1]+'</option>';
       }).join('') + '</select></div>';

  h += '<div class="cg"><label>Onnistumisen tulkinta</label><div class="seg">' +
       [['salliva','Salliva'],['tiukka','Tiukka'],['karki','Kärkilyönti']]
       .map(function(o){
         return '<button data-t="'+o[0]+'"'+
                (S.tulkinta===o[0]?' class="on"':'')+'>'+o[1]+'</button>';
       }).join('') + '</div></div>';

  if (S.tulkinta !== 'karki'){
    var halpaValittu = S.tilanteet.filter(function(t){ return HALPA_TIL[t]; });
    if (halpaValittu.length){
      h += '<div class="warn" style="flex:1 1 100%">' +
        '<b>Huom.</b> Valituissa tilanteissa ' +
        halpaValittu.map(function(t){ return esc(TIL_NIMI[t]||t); }).join(', ') +
        ' ykköspesä on tyhjä, joten lyöjä saa onnistumisen pelkästään ' +
        'menemällä itse ykköselle — kärki ei etene. Se nostaa onnistumis-%:a ' +
        'keinotekoisesti. Valitse <b>Kärkilyönti</b>-tulkinta jos haluat ' +
        'laskea vain kärjen etenemiset.</div>';
    }
  }
  h += '</div>';

  // ---- Avainluvut ----
  var idxTxt = me.indeksi===null ? '–' : me.indeksi.toFixed(0);

  h += '<div class="kpis">';
  h += kpi('cyan','Onnistuminen / lyöntivuoro', pros(me.p),
           luku(me.onn)+' / '+luku(me.n)+' vuoroa');
  h += kpi('lime','Ketjuja yhteensä', luku(me.ketjujaYht),
           'odotettu ' + me.odotettuYht.toFixed(0));
  h += kpi('green','Pitkiä ketjuja (3+)', luku(me.ketjuja3),
           'odotettu ' + me.odotettu3.toFixed(0));
  h += kpi('orange','Ketjuindeksi', idxTxt,
           '100 = tasan odotusarvo', idxVari(me.indeksi));
  h += '</div>';

  h += '<div class="grid">';

  // ---- Ketjujakauma ----
  h += '<div class="card"><h2>Ketjun pituusjakauma</h2>' +
       '<div class="hint">Montako kertaa syntyi tasan sen mittainen putki ' +
       'peräkkäisiä onnistuneita lyöntivuoroja. Harmaa varjo = <b>odotettu</b>, ' +
       'eli mitä joukkueen oma perustaso tuottaisi jos lyöntivuorot olisivat ' +
       'toisistaan riippumattomia.</div>';
  var maxK = Math.max.apply(null, me.ketjut.slice(1));
  var maxO = Math.max.apply(null, me.odotettu.slice(1));
  var skaala = Math.max(maxK, maxO) || 1;
  for (var k=1;k<=MAXP;k++){
    var lbl = (k===MAXP? MAXP+'+' : String(k)) + (k===1?' onnistuminen':' peräkkäin');
    var od1 = me.odotettu[k];
    h += '<div class="bar"><div class="top"><span>'+lbl+'</span>' +
         '<b>'+luku(me.ketjut[k])+'<span style="color:var(--text-muted);' +
         'font-weight:400"> / od. '+od1.toFixed(0)+'</span></b></div>' +
         '<div class="track">' +
         '<div class="ghost" style="width:'+(od1/skaala*100)+'%"></div>' +
         '<div class="fill" style="width:'+(me.ketjut[k]/skaala*100)+'%;' +
         'background:'+(k>=4?'var(--accent-lime)':'var(--accent-cyan)')+'"></div>' +
         '</div></div>';
  }
  h += '<div class="legend"><span><i style="background:var(--accent-cyan)"></i>' +
       'Toteutunut ('+esc(S.jk)+')</span>' +
       '<span><i style="background:rgba(143,163,192,.5)"></i>' +
       'Odotettu riippumattomuudella</span></div></div>';

  // ---- Ketju -> juoksut ----
  h += '<div class="card"><h2>Mitä ketju tuottaa</h2>' +
       '<div class="hint">Juoksuja keskimäärin ketjua kohti. Tässä näkyy ' +
       'muuttuvatko rakennetut tilanteet oikeasti juoksuiksi — pitkä ketju ' +
       'ilman juoksuja on se turhauttavin lopputulos.</div>';
  var maxJr = 0;
  for (var m=1;m<=MAXP;m++){
    if (me.ketjut[m]) maxJr = Math.max(maxJr, me.ketjuJr[m]/me.ketjut[m]);
  }
  maxJr = maxJr || 1;
  for (var r2=1;r2<=MAXP;r2++){
    var kpl2 = me.ketjut[r2];
    var ka2 = kpl2 ? me.ketjuJr[r2]/kpl2 : 0;
    var lbl2 = (r2===MAXP? MAXP+'+' : String(r2)) + ' pitkä';
    h += '<div class="bar"><div class="top"><span>'+lbl2+
         '<span style="color:var(--text-muted)"> ('+luku(kpl2)+' kpl)</span></span>' +
         '<b>'+ka2.toFixed(2).replace('.',',')+' juoksua</b></div>' +
         '<div class="track"><div class="fill" style="width:'+(ka2/maxJr*100)+'%;' +
         'background:var(--accent-green)"></div></div></div>';
  }
  h += '<div class="legend"><span>Juoksuja yhteensä aikavälillä: <b style="color:' +
       'var(--text-primary)">'+luku(me.juoksut)+'</b></span></div></div>';

  // ---- Tilannekohtainen onnistuminen ----
  h += '<div class="card"><h2>Onnistuminen tilanteittain</h2>' +
       '<div class="hint">Onnistumis-% lyöntivuoroa kohti kussakin ' +
       'pesätilanteessa. Paljastaa systemaattisen heikon lenkin — sen kohdan ' +
       'jossa ketju katkeaa muita useammin.</div>';
  for (var t2=0;t2<TIL.length;t2++){
    var nn = me.tilN[t2];
    if (!nn) continue;
    var pp = me.tilOnn[t2]/nn;
    var vari = pp >= me.p+0.05 ? 'var(--accent-green)'
             : pp <= me.p-0.05 ? 'var(--accent-red)' : 'var(--accent-cyan)';
    var halpa = (S.tulkinta !== 'karki' && HALPA_TIL[TIL[t2]])
      ? ' <span title="Ykköspesä tyhjä — pelkkä ykköselle meno riittää" ' +
        'style="color:var(--accent-orange)">▲</span>' : '';
    h += '<div class="bar"><div class="top"><span>'+esc(TIL_NIMI[TIL[t2]]||TIL[t2])+
         halpa+'<span style="color:var(--text-muted)"> ('+luku(nn)+')</span></span>' +
         '<b>'+pros(pp)+'</b></div>' +
         '<div class="track"><div class="fill" style="width:'+(pp*100)+'%;' +
         'background:'+vari+'"></div></div></div>';
  }
  h += '<div class="legend"><span>Joukkueen keskitaso: <b style="color:' +
       'var(--text-primary)">'+pros(me.p)+'</b> — vihreä yli, punainen alle</span>' +
       '</div></div>';

  // ---- Ketjuindeksi-taulukko ----
  h += '<div class="card wide"><h2>Ketjuindeksi — koko sarja</h2>' +
       '<div class="hint">Toteutuneet peräkkäiset onnistumiset verrattuna ' +
       'siihen, mitä joukkueen <em>oma</em> perustaso tuottaisi jos lyöntivuorot ' +
       'olisivat toisistaan riippumattomia. <b>100 = tasan odotusarvo.</b> ' +
       'Yli 100 = onnistumiset kasautuvat, alle 100 = joukkue hukkaa alkaneita ' +
       'tilanteita. Tämä erottaa ketjutusongelman yleisestä heikkoudesta: ' +
       'matala perus-% tuottaa vähän pitkiä ketjuja ilman mitään ketjuilmiötä.</div>';
  h += '<table><thead><tr><th>Joukkue</th><th>Onn.%/vuoro</th>' +
       '<th>Ketjuja</th><th>3+ toteutunut</th><th>3+ odotettu</th>' +
       '<th>Juoksua/ketju</th><th>Ketjuindeksi</th></tr></thead><tbody>';
  var jarj = kaikki.slice().sort(function(a,b){
    return (b.indeksi===null?-1:b.indeksi) - (a.indeksi===null?-1:a.indeksi);
  });
  jarj.forEach(function(t){
    var jrKetju = t.ketjujaYht ?
      (t.ketjuJr.reduce(function(a,b){return a+b;},0)/t.ketjujaYht) : 0;
    h += '<tr'+(t.jk===S.jk?' class="me"':'')+'><td>'+esc(t.jk)+'</td>' +
         '<td>'+pros(t.p)+'</td><td>'+luku(t.ketjujaYht)+'</td>' +
         '<td>'+luku(t.ketjuja3)+'</td>' +
         '<td style="color:var(--text-secondary)">'+t.odotettu3.toFixed(0)+'</td>' +
         '<td>'+jrKetju.toFixed(2).replace('.',',')+'</td>' +
         '<td><span class="pill" style="background:'+idxVari(t.indeksi)+';' +
         'color:#0d1422">'+(t.indeksi===null?'–':t.indeksi.toFixed(0))+
         '</span></td></tr>';
  });
  h += '</tbody></table></div>';

  h += '</div>'; // grid

  // ---- Alaviite ----
  h += '<div class="foot">' +
    '<b>Määrittelyt.</b> Lyöntivuoro = yhden lyöjän vuoro, 1–3 lyöntiä. ' +
    'Onnistuminen = <i>Onnistuminen</i> tai <i>Vapaataival</i>. ' +
    'Epäonnistuminen = <i>Palo</i> tai <i>Haavoittuminen</i>. ' +
    '<i>Tuottamaton</i> on neutraali eikä katkaise vuoroa.<br>' +
    '<b>Salliva</b> = vuoro onnistui jos yksikin lyönti onnistui. ' +
    '<b>Tiukka</b> = lisäksi vaaditaan ettei syntynyt paloa eikä haavaa. ' +
    '<b>Kärkilyönti</b> = onnistumiseksi kelpaa vain <i>kärjen</i> eteneminen, ' +
    'eli Pesäväli vastaa sitä pesää jolla kärki on ' +
    '(0→0-1, 1→1-2, 2 ja 1-2→2-3, 3 / 1-3 / 2-3 / 1-2-3→3-K). ' +
    'Tämä poistaa vinouman tilanteista joissa ykköspesä on tyhjä: niissä ' +
    'lyöjä saa muuten onnistumisen pelkästään menemällä itse ykköselle, ' +
    'vaikka kärki jää paikalleen.<br>' +
    'Ketju katkeaa epäonnistuneeseen lyöntivuoroon tai lyöntivuoroparin loppuun. ' +
    'Ketju luokitellaan <i>ensimmäisen</i> lyöntivuoronsa tilanteen mukaan.<br>' +
    '<b>Ketjuindeksi</b> = toteutuneet 3+ ketjut / odotetut 3+ ketjut × 100. ' +
    'Odotusarvo saadaan permutaatiotestillä: joukkueen omat onnistumiset ' +
    'sekoitetaan satunnaiseen järjestykseen samaan vuoropari&shy;rakenteeseen ' +
    '(' + SIM_KIERROKSIA + ' kierrosta). Onnistumisten määrä ja rakenne ' +
    'säilyvät täsmälleen, vain järjestys satunnaistuu — jäljelle jää se, ' +
    'kasautuvatko onnistumiset vai eivät. Suora vertailu perustasoon ei kelpaa, ' +
    'koska vuoroparin loppu typistää keskeneräiset ketjut ja painaisi kaikkia ' +
    'joukkueita alaspäin. Indeksi näytetään vain kun odotettuja 3+ ketjuja on ' +
    'vähintään 10.<br>' +
    'Kausi ' + esc(PKETJUT.kausi) + ', ' + luku(PKETJUT.vuoroparit.length) +
    ' lyöntivuoroparia. Lähde: MasterLyonnit (Vain arvot.xlsx). ' +
    '</div>';

  app.innerHTML = h;
  sub.textContent = 'Kausi ' + PKETJUT.kausi + ' · ' + joukkueet.length +
    ' joukkuetta · ' + luku(PKETJUT.vuoroparit.length) + ' lyöntivuoroparia · ' +
    PVM_MIN + ' – ' + PVM_MAX;
  kiinnita();
}

function kpi(vari, lab, val, note, valVari){
  return '<div class="kpi '+vari+'"><div class="lab">'+esc(lab)+'</div>' +
    '<div class="val"'+(valVari?' style="color:'+valVari+'"':'')+'>'+val+'</div>' +
    '<div class="note">'+esc(note)+'</div></div>';
}

function kiinnita(){
  document.getElementById('f-jk').onchange = function(){ S.jk=this.value; render(); };
  document.getElementById('f-pa').onchange = function(){ S.palot=this.value; render(); };
  document.getElementById('f-jakso').onchange = function(){ S.jakso=this.value; render(); };

  Array.prototype.forEach.call(
    document.querySelectorAll('.seg button'), function(b){
      b.onclick = function(){ S.tulkinta = this.dataset.t; render(); };
    });

  // Tilannesirut
  Array.prototype.forEach.call(
    document.querySelectorAll('.chip'), function(c){
      c.onclick = function(){
        var t = this.dataset.til, i = S.tilanteet.indexOf(t);
        if (i >= 0) S.tilanteet.splice(i,1); else S.tilanteet.push(t);
        if (!S.tilanteet.length) S.tilanteet = TIL.slice();   // ei tyhjää
        render();
      };
    });

  // Pikavalinnat
  Array.prototype.forEach.call(
    document.querySelectorAll('.mini button'), function(b){
      b.onclick = function(){
        var m = this.dataset.sel;
        if (m === 'kaikki')        S.tilanteet = TIL.slice();
        else if (m === 'tayttyva') S.tilanteet = TIL.filter(function(t){ return HALPA_TIL[t]; });
        else                       S.tilanteet = TIL.filter(function(t){ return !HALPA_TIL[t]; });
        render();
      };
    });
}

render();
})();
</script>
</body>
</html>
